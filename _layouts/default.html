<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  {% capture build_v %}{{ site.time | date: '%s' }}{% endcapture %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ build_v }}">
  <link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}?v={{ build_v }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} class="active"{% endif %}>Home</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.url contains "/blog" %} class="active"{% endif %}>Blog</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>© {{ site.time | date: "%Y" }} {{ site.title }}</p>
  </footer>
</body>
</html>
